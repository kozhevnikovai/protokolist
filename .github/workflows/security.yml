name: security
# CodeQL — поиск уязвимостей в коде; gitleaks — поиск ключей и паролей по всей истории коммитов
on:
  push: { branches: [main, "release/**"] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]
permissions: { contents: read }
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      matrix: { language: [javascript-typescript, actions] }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v4
        with: { category: "/language:${{ matrix.language }}" }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (вся история)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner --exit-code 1
